services:
  iris:
    build:
      context: .
    image: iris-dataset-hub:dev
    ports:
      - "${IRIS_SQL_PORT:-1972}:1972"
      - "${IRIS_WEB_PORT:-52773}:52773"
    environment:
      # optional credentials, passed through from the host environment only when set
      - HF_TOKEN
      - KAGGLE_API_TOKEN
      - KAGGLE_USERNAME
      - KAGGLE_KEY
    # the image's own check script; the arm64 base image ships it without a HEALTHCHECK
    healthcheck:
      test: ["CMD", "/irisHealth.sh"]
      interval: 5s
      timeout: 10s
      retries: 12
